[package]
name = "lurkwire-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lurkwire intercepting proxy sidecar"
publish = false

[lib]
name = "lurkwire_proxy"
path = "src/lib.rs"

[[bin]]
name = "lurkwire-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json", "tokio"] }
base64 = "0.23.1"
brotli = "8.0.2"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
hyper = { version = "1.12.0", features = ["http1", "http2", "client", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.21", features = ["full"] }
mime = "0.3.18"
rcgen = { version = "0.14.10", features = ["pem", "ring", "x509-parser"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
regex = "1.12.2"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
